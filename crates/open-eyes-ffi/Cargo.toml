[package]
name = "open-eyes-ffi"
description = "C ABI boundary for open-eyes — extern C functions, cbindgen header generation"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
open-eyes-core = { path = "../open-eyes-core" }
open-eyes-camera = { path = "../open-eyes-camera" }
open-eyes-detect = { path = "../open-eyes-detect" }
image = { workspace = true }
nalgebra = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
cbindgen = "0.27"
